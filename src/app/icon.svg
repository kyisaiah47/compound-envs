<!-- THE COMPOUND LABS LOGO, the plated cut, byte for byte from the estate's one source:
     compound-ops/brand/compound-labs/logo/compound-labs-plate.svg, md5 79ba913f411499a7b9500b0bc1594ac6.
     compound-evals is the lab's own instrument made public, kind infra, so it carries the lab's
     logo rather than a mark of its own. Isaiah, 2026-09-21: 'yeah just use the defualt compound
     logo'. The PLATED cut and not the bare one, because it brings its own #1a1a1a ground and so
     reads at 16px in the app strip the same way every other tile there does.
     This file exists because the strip reads src/app/icon.svg on the default branch and cannot
     read the TypeScript module in src/icons/. Never redraw it, never recolour it, and check it
     by BYTES: the name cannot tell two cubes apart, which is how a red-diamond cube shipped
     estate wide for four days under this exact filename. -->
