<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -11 62 62" width="62" height="62">
  <!-- Isaiah, 2026-08-26: "make the logo bg this color too" the prism sweep the product
       uses as its accent. A favicon cannot inherit currentColor or a CSS variable, so the
       gradient is declared here.

       NO DOUBLE HYPHEN ANYWHERE IN THIS COMMENT. It is illegal inside an XML comment, so
       naming the CSS token in prose the house way makes the whole document a parse error.
       Chrome serves it 200 with image/svg+xml and then shows the default globe in the tab
       and nothing in the console. That is exactly the state this file shipped in until
       2026-08-27. Write the tokens bare: prism, prism-glow.

       THE STOPS ARE NOT prism's ORDER, AND THAT IS THE FIX. prism puts #ffe27a at 52%,
       dead centre. A favicon is a 16px square: you see its middle and almost nothing else, so
       a five-stop aurora with gold in the middle renders as a plain yellow tile which is all
       the tab ever showed. Isaiah, 2026-08-26: "change the favicon and all instnaces of this
       disguting yellow bg with the auorara glow we have for the accents". Same five colours,
       resequenced so the centre of the square is the pink to violet to blue run the glow is
       built from (prism-glow is pink and blue) and the gold is a corner it never dominates. -->
  <defs>
    <linearGradient id="p" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9ad9"/>
      <stop offset=".3" stop-color="#d6a6ff"/>
      <stop offset=".58" stop-color="#9ac4ff"/>
      <stop offset=".84" stop-color="#8affe0"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
  </defs>
  <rect x="-2" y="-11" width="62" height="62" fill="url(#p)"/>
