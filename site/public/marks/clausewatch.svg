<!--
  THE CLAUSEWATCH MARK: an eye holding one line of a contract.

  THE IDEA. The renewal that caught you was never hidden. It was one line on page four, and the
  product is the nightly re reading that finds that line before the notice window shuts. So the
  mark is an eye, and its pupil is not a dot: it is a rule, the width of a line of type, in the
  accent. Above and below it sit two quieter rules in the ground colour, the rest of the contract,
  which the product reads every night and never mentions. The eye is fixed on the one that has a
  date on it.

  WHY AN EYE WITH A RULE IN IT AND NOT A PAGE. The previous mark was a page outline with a bar
  struck through it, which is a document glyph plus a strikethrough and belongs to anything that
  opens a PDF. This product is named for watching, and what it watches is a line. Putting the line
  where the pupil goes makes the two facts one shape instead of two objects sharing a tile.

  THE COUNTERFORM IS THE DOCUMENT. The two ground rules are the only thing making the almond read
  as a page under glass rather than as an eye alone, and they are the part designed to disappear:
  at 120px there are three lines and one of them matters, at 16px they close up and what is left
  is the accent rule inside the lens, which is still the whole sentence.

  DRAWN AT 64 UNITS, NOT 16. The almond is two true circular arcs meeting at a point, which a 12
  module grid cannot express at all. The accent rule is 8 units, which is 2px in a browser tab.

  NO WORDMARK IN THE IMAGE. The frame's Wordmark sets the name in live text beside the mark.

  THE ACCENT IS STAMPED, NOT AUTHORED. The accent group carries data-palette="accent" and its
  fill is rewritten from this repo's own palette by scripts/_palette.mjs at render time. The hex
  below is what that palette resolves to today; it is not the source of truth for the colour.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="ClauseWatch">
  <rect width="64" height="64" fill="#1a1a1a"/>
  <path fill="#f2f2f2" d="M 4 32 A 36.65 36.65 0 0 1 60 32 A 36.65 36.65 0 0 1 4 32 Z"/>
  <g fill="#1a1a1a">
    <rect x="20" y="23.5" width="24" height="2.5"/>
    <rect x="20" y="38" width="24" height="2.5"/>
  </g>
  <g data-palette="accent" fill="#f68d04">
    <rect x="20" y="29" width="18" height="6"/>
  </g>
</svg>
